<style>
/* ===== Sistema de diseño (fto-v9): variables, claro/oscuro, botones grandes para guantes ===== */
:root{color-scheme:light dark;
 --bg:#eef1f5;--card:#fff;--card2:#f6f8fa;--inset:#f3f5f8;--line:#d5dbe3;--tx:#11161d;--mut:#4f5b69;
 --acc:#ff6b00;--acc-hi:#ff8533;--acc-lo:#e55a00;--on-acc:#111;--acc-soft:#fff1e6;
 --ok:#0e8a3e;--on-ok:#fff;--warn:#f5b700;--red:#e0281c;--red-hi:#f03a2e;--blue:#0a66ff;--blue-hi:#2e7dff;
 --sec:#e3e8ef;--sec-hi:#d6dde7;--sec-tx:#11161d;--seg:#dfe4eb;
 --hdr:#111827;--hdr-tx:#fff;--hdr-mut:#b6c0cc;
 --ej-bg:#ffd23f;--ej-tx:#1a1400;--al-bg:#fdecea;--al-tx:#7a1010;--fal-bg:#fff7d6;--fal-tx:#6b5200;--nota-bg:#e8f1ff;--nota-bd:#0a66ff;
 --t-fw-bg:#fde2e0;--t-fw-tx:#8a1c12;--t-sh-bg:#dcebff;--t-sh-tx:#0b4a99;--t-rc-bg:#fbf1c7;--t-rc-tx:#6b5200;--t-ok-bg:#d8f3e3;--t-ok-tx:#0e5c32;--t-pen-bg:#fff0c2;--t-pen-tx:#6b4d00;
 --sh1:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.07);--sh2:0 4px 14px rgba(16,24,40,.12);--shb:0 2px 0 rgba(0,0,0,.18);
 --r:16px;--rb:14px;--tap:48px;--fast:.15s}
html[data-theme=dark]{
 --bg:#0e1116;--card:#1a1f27;--card2:#202631;--inset:#0b0e13;--line:#2e3644;--tx:#f2f5f8;--mut:#a9b4c2;
 --acc:#ff7a1a;--acc-hi:#ff9447;--acc-lo:#e86400;--acc-soft:#3a210c;
 --ok:#2fd06f;--on-ok:#052e14;--warn:#ffc933;--red:#ff5246;--red-hi:#ff6d63;--blue:#3b8bff;--blue-hi:#5c9fff;
 --sec:#2a313d;--sec-hi:#343c4a;--sec-tx:#f2f5f8;--seg:#141920;
 --hdr:#0b0f14;--ej-bg:#ffcc33;--ej-tx:#1a1400;--al-bg:#3d1210;--al-tx:#ffc2bc;--fal-bg:#2e2700;--fal-tx:#ffe48a;--nota-bg:#10233a;--nota-bd:#4da3ff;
 --t-fw-bg:#5a1a1a;--t-fw-tx:#ffb3b3;--t-sh-bg:#1a3a5a;--t-sh-tx:#b3d9ff;--t-rc-bg:#3a3a1a;--t-rc-tx:#ffe9a3;--t-ok-bg:#123d26;--t-ok-tx:#a6f0c6;--t-pen-bg:#3d3100;--t-pen-tx:#ffe48a;
 --sh1:0 1px 2px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.35);--sh2:0 6px 18px rgba(0,0,0,.5);--shb:0 2px 0 rgba(0,0,0,.45)}
@media (prefers-color-scheme:dark){html:not([data-theme]){
 --bg:#0e1116;--card:#1a1f27;--card2:#202631;--inset:#0b0e13;--line:#2e3644;--tx:#f2f5f8;--mut:#a9b4c2;
 --acc:#ff7a1a;--acc-hi:#ff9447;--acc-lo:#e86400;--acc-soft:#3a210c;
 --ok:#2fd06f;--on-ok:#052e14;--warn:#ffc933;--red:#ff5246;--red-hi:#ff6d63;--blue:#3b8bff;--blue-hi:#5c9fff;
 --sec:#2a313d;--sec-hi:#343c4a;--sec-tx:#f2f5f8;--seg:#141920;
 --hdr:#0b0f14;--ej-bg:#ffcc33;--ej-tx:#1a1400;--al-bg:#3d1210;--al-tx:#ffc2bc;--fal-bg:#2e2700;--fal-tx:#ffe48a;--nota-bg:#10233a;--nota-bd:#4da3ff;
 --t-fw-bg:#5a1a1a;--t-fw-tx:#ffb3b3;--t-sh-bg:#1a3a5a;--t-sh-tx:#b3d9ff;--t-rc-bg:#3a3a1a;--t-rc-tx:#ffe9a3;--t-ok-bg:#123d26;--t-ok-tx:#a6f0c6;--t-pen-bg:#3d3100;--t-pen-tx:#ffe48a;
 --sh1:0 1px 2px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.35);--sh2:0 6px 18px rgba(0,0,0,.5);--shb:0 2px 0 rgba(0,0,0,.45)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
/* encabezado fijo con espacio para la muesca del iPhone */
header{position:sticky;top:0;z-index:20;background:var(--hdr);color:var(--hdr-tx);display:flex;align-items:center;gap:6px;
 padding:calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 8px calc(12px + env(safe-area-inset-left));
 border-bottom:3px solid var(--acc);box-shadow:0 2px 10px rgba(0,0,0,.25)}
header>div:first-child{width:32px;height:32px;flex:0 0 32px;display:flex;align-items:center;justify-content:center;background:var(--acc);border-radius:12px;font-size:19px!important}
header h1{font-size:16px;line-height:1.15;margin:0;flex:1;min-width:0;font-weight:800;letter-spacing:.1px;overflow:hidden}
header small{color:var(--hdr-mut);display:block;font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button.sec{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22);box-shadow:none}
header button.sec:hover{background:rgba(255,255,255,.2)}
main{padding:14px calc(14px + env(safe-area-inset-right)) calc(90px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));max-width:760px;margin:auto}
#app>*{animation:entra .18s ease-out}@keyframes entra{from{opacity:.0}to{opacity:1}}
h3{font-size:18px;font-weight:800;margin:18px 0 8px;letter-spacing:.1px}
#app>h3,#res>h3,.modulos>h3{display:flex;align-items:center;gap:8px;margin:22px 2px 10px}
#app>h3::after,#res>h3::after,.modulos>h3::after{content:"";flex:1;height:2px;border-radius:2px;background:var(--line)}
p{margin:10px 0}
a{color:var(--blue)}
/* ===== Botones: primario (acento), secundario, peligro, azul; estados de presión ===== */
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);
 background:var(--acc);color:var(--on-acc);border:0;border-radius:var(--rb);padding:12px 18px;font:inherit;font-size:17px;font-weight:750;line-height:1.2;
 text-align:center;text-decoration:none;cursor:pointer;box-shadow:var(--shb),inset 0 -2px 0 rgba(0,0,0,.12);
 transition:background-color var(--fast),transform var(--fast),box-shadow var(--fast),filter var(--fast);touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:hover,.btn:hover{background:var(--acc-hi)}
button:active,.btn:active{transform:translateY(1px) scale(.985);box-shadow:inset 0 2px 4px rgba(0,0,0,.2);filter:brightness(.95)}
button:focus-visible,.btn:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.sec,.btn.sec{background:var(--sec);color:var(--sec-tx);box-shadow:inset 0 0 0 1px var(--line)}
button.sec:hover,.btn.sec:hover{background:var(--sec-hi)}
button.red,.btn.red{background:var(--red);color:#fff}button.red:hover{background:var(--red-hi)}
button.sm,.btn.sm{padding:10px 14px;font-size:15px;border-radius:12px}
button:disabled,button:disabled:hover{opacity:.45;cursor:not-allowed;transform:none;filter:grayscale(.3);background:var(--acc)}
button.sec:disabled{background:var(--sec)}
.big1{width:100%;font-size:20px;padding:16px;min-height:60px;border-radius:16px}
button.buscar{background:var(--blue);color:#fff}button.buscar:hover{background:var(--blue-hi)}
/* campos */
input,select,textarea{width:100%;background:var(--card);color:var(--tx);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;min-height:var(--tap);transition:border-color var(--fast),box-shadow var(--fast)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 25%,transparent)}
input[type=checkbox],input[type=radio]{width:24px!important;height:24px;min-height:0;vertical-align:-5px;margin-right:8px;accent-color:var(--acc)}
input[type=color]{padding:3px;min-height:0}
input[type=file]{padding:8px;font-size:15px;background:var(--card2)}
input[type=file]::file-selector-button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 14px;margin-right:10px;background:var(--sec-hi);color:var(--sec-tx)}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.85}
select{accent-color:var(--acc)}
textarea{min-height:80px;resize:vertical}
label{display:block;margin:14px 0 6px;color:var(--mut);font-size:15px;font-weight:650}
/* tarjetas */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--sh1)}
.card h3{margin:0 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.list-item{cursor:pointer;position:relative;transition:transform var(--fast),box-shadow var(--fast),border-color var(--fast)}
.list-item:hover{border-color:color-mix(in srgb,var(--acc) 55%,var(--line));box-shadow:var(--sh2)}
.list-item:active{transform:scale(.99);background:var(--card2)}
details.card>summary{cursor:pointer;min-height:var(--tap);display:flex;align-items:center;gap:8px;list-style:none;margin:-4px 0}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:"▸";color:var(--acc);font-size:20px;transition:transform var(--fast)}
details[open].card>summary::before{transform:rotate(90deg)}
.tag{display:inline-block;vertical-align:middle;line-height:1.35;background:var(--sec);color:var(--sec-tx);border-radius:999px;padding:4px 11px;margin:3px 2px;font-size:13px;font-weight:650}
.tag.fw{background:var(--t-fw-bg);color:var(--t-fw-tx)}.tag.sh{background:var(--t-sh-bg);color:var(--t-sh-tx)}.tag.rc{background:var(--t-rc-bg);color:var(--t-rc-tx)}
.tag.okt{background:var(--t-ok-bg);color:var(--t-ok-tx)}.tag.pen{background:var(--t-pen-bg);color:var(--t-pen-tx)}
.ej{background:var(--ej-bg);color:var(--ej-tx);font-weight:800;text-align:center;padding:10px 12px;border-radius:14px;margin:10px 0;font-size:14px;box-shadow:var(--sh1);border:1px solid rgba(0,0,0,.08)}
.big{font-size:22px;font-weight:850;letter-spacing:.2px}.mut{color:var(--mut);font-size:15px}
.spec{display:grid;grid-template-columns:42% 58%;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px}
.spec div{padding:10px 10px;border-bottom:1px solid var(--line)}.spec div:nth-child(odd){color:var(--mut);font-size:14px;background:var(--card2);font-weight:600}
.spec div:nth-child(even){font-weight:700}.spec div:nth-last-child(-n+2){border-bottom:0}
.pend{color:var(--fal-tx);background:var(--fal-bg);border-radius:6px;padding:0 4px;font-style:italic}
.alerta{background:var(--al-bg);color:var(--al-tx);border-left:6px solid var(--red);padding:12px;border-radius:12px;margin:10px 0;font-weight:750}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1}
img.adj{max-width:100%;border-radius:12px;margin-top:10px;border:1px solid var(--line);box-shadow:var(--sh1)}
.doc{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.5;overflow-wrap:anywhere;background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
mark{background:var(--acc);color:#111;border-radius:4px;padding:0 2px}.nf{color:var(--fal-tx);font-weight:700}
.faltan{background:var(--fal-bg);color:var(--fal-tx);border:2px dashed var(--warn);border-radius:var(--r);padding:14px;margin:12px 0}.faltan h3{color:inherit;margin:0 0 6px}.faltan .mut{color:inherit}
.snip{font-size:14px;color:var(--mut);margin-top:6px;overflow-wrap:anywhere}
/* control segmentado De / Para la oficina (queda fijo bajo el encabezado) */
.tabs.dir{position:sticky;top:calc(62px + env(safe-area-inset-top));z-index:10;margin:12px 0 8px;padding:5px;background:var(--seg);border-radius:18px;box-shadow:var(--sh1);gap:5px}
.tabs.dir button{padding:12px 6px;font-size:15px;min-height:52px;border-radius:14px}
.tabs button.off{background:transparent;color:var(--tx);box-shadow:none}.tabs button.off:hover{background:var(--sec-hi)}
.tabs.dir button.on{box-shadow:var(--sh2)}
.dirnota{margin:2px 4px 10px}
.share{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.share>*{width:100%}
.atendido{opacity:.6}
.modulos{margin-top:26px;padding-top:4px}.modcard{display:block;text-decoration:none;color:var(--tx);border-left:6px solid var(--acc)}.modcard .ext{float:right;color:var(--acc-lo);font-size:14px;font-weight:800;background:var(--acc-soft);padding:4px 10px;border-radius:999px}
@media (prefers-color-scheme:dark){.modcard .ext{color:var(--acc)}}
.modnota{background:var(--nota-bg);border-left:6px solid var(--nota-bd);padding:12px;border-radius:12px;margin:10px 0;color:var(--tx)}
.stagewrap{width:100%;margin:10px 0}.stage{position:relative;margin:0 auto;background:#000;border-radius:16px;touch-action:manipulation;user-select:none;-webkit-user-select:none;border:1px solid var(--line);width:100%;height:240px;box-shadow:var(--sh2)}
.stage video,.stage canvas,.stage img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:16px}.stage .dots{position:absolute;inset:0;pointer-events:none}
.dot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #000,0 2px 6px rgba(0,0,0,.7);font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;line-height:1}
.cammsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:#fff;background:rgba(0,0,0,.65);font-weight:700;font-size:15px;border-radius:16px}
.badge{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.72);color:#fff;font-size:13px;font-weight:700;padding:5px 9px;border-radius:10px;pointer-events:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
button.chiprep{flex:0 0 auto;background:var(--card);border:3px solid var(--line);color:var(--tx);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:750;box-shadow:var(--sh1)}
button.chiprep:hover{background:var(--card2)}button.chiprep.sel{border-color:var(--acc);background:var(--acc-soft)}
.sw{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:-2px;margin-right:2px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);flex:0 0 auto}.sw.big{width:26px;height:26px}
.leyrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.leyrow>div{flex:1}.pitem{padding:10px 4px;border-bottom:1px solid var(--line)}
img.thumb{width:96px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#000}.secmarcas{border-left:6px solid #ff3b30}
.guiaov{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:16px;z-index:3}
.gflecha{position:absolute;pointer-events:auto;display:flex;align-items:center;gap:3px;cursor:pointer}.gflecha .glbl{width:max-content;max-width:150px}
.garrow{width:58px;height:58px;flex:0 0 auto;filter:drop-shadow(0 0 3px #000) drop-shadow(0 0 6px rgba(0,0,0,.8));animation:empuje 1s ease-in-out infinite}.garrow svg{width:100%;height:100%;display:block}
@keyframes empuje{0%,100%{opacity:1}50%{opacity:.6}}
.glbl{background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:700;padding:4px 7px;border-radius:8px;text-align:center;line-height:1.25}
.gnum{display:inline-block;min-width:20px;height:20px;padding:0 3px;border-radius:10px;border:2px solid #fff;margin-right:3px;text-align:center;line-height:16px;font-weight:900}
.ring{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #000;animation:pulso 1.2s ease-out infinite;pointer-events:none;z-index:2}.ring.r2{animation-delay:.6s}
@keyframes pulso{0%{transform:scale(1);opacity:1}100%{transform:scale(3);opacity:0}}
.dot.objetivo{z-index:3}#guiaInfo{font-weight:700;color:var(--tx);margin-top:6px}#guiaCtl select{flex:1 1 auto}
.microw{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}button.mic.on{background:var(--red);color:#fff;box-shadow:0 0 0 4px rgba(224,40,28,.3)}.micst{color:var(--red);font-weight:700}.michint{font-size:13px}
header .rolb{min-height:44px;padding:5px 9px!important;background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:800;white-space:nowrap;box-shadow:none}
.rolb{min-height:40px;background:var(--sec);color:var(--sec-tx);border:2px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:800;white-space:nowrap;box-shadow:none}
header .rolb.sup,.rolb.sup{background:var(--ok);color:var(--on-ok);border-color:var(--ok)}
header button{min-height:44px;padding:8px 8px;font-size:13.5px;flex:0 0 auto;margin-right:0}
.rolaviso{background:var(--fal-bg);color:var(--fal-tx);border:2px dashed var(--warn);border-radius:var(--r);padding:12px;margin:10px 0;display:flex;flex-direction:column;gap:10px}.rolaviso b{color:inherit}
.rolmsg{color:var(--red);font-weight:700;min-height:22px;margin-top:8px}.pinin{font-size:28px;letter-spacing:10px;text-align:center;font-weight:800}.pinin::placeholder{letter-spacing:1px;font-size:17px;font-weight:600}
.buscatit{font-size:20px;font-weight:850;margin:8px 0 4px}
.guiabar{display:flex;gap:8px;margin:6px 0}.guiabar button{font-size:22px;padding:16px 10px;min-height:60px}.guiabar #btnGuiar{flex:1;font-size:21px}.guiabar #btnGuiaAntC,.guiabar #btnGuiaSigC{flex:0 0 22%}#btnGuiar.on{background:#30d158;color:#06210f}
/* fto-v11: 📷 cámara grande con flechas en vivo */
.stagewrap.full{position:fixed;inset:0;z-index:25;margin:0;background:#000;width:auto}
.stage.full{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;border:0;border-radius:0;box-shadow:none}
.stage.full video,.stage.full canvas,.stage.full img,.stage.full .guiaov,.stage.full .cammsg{border-radius:0}
.stage.full .gflecha:not(.otra){display:none}body.vivoOn{overflow:hidden}
.vivohud{position:absolute;inset:0;pointer-events:none;color:#fff;z-index:6;font-family:inherit}.vivohud button,.vivohud input{pointer-events:auto}
.vtop{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 8px 14px;display:flex;gap:8px;align-items:center;background:linear-gradient(rgba(0,0,0,.78),rgba(0,0,0,0))}
.vivohud button{min-height:50px;padding:8px 12px;font-size:16px;font-weight:800;background:rgba(0,0,0,.62);color:#fff;border:2px solid rgba(255,255,255,.65);border-radius:14px;box-shadow:none;margin:0;width:auto}
.vivohud button.on{background:rgba(48,209,88,.85);color:#06210f;border-color:#30d158}
.vtit{flex:1;font-weight:850;font-size:15px;text-shadow:0 1px 3px #000;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vop{position:absolute;right:10px;top:calc(70px + env(safe-area-inset-top));width:46%;max-width:240px}.vop input{width:100%;margin:0;accent-color:#30d158}
.vflecha,.vz{position:absolute;left:0;top:0;width:100px;height:100px;will-change:transform;opacity:.73;filter:drop-shadow(0 0 1.5px rgba(0,0,0,.9)) drop-shadow(0 0 6px rgba(0,0,0,.5))}
/* fto-v11b: flechas un poco transparentes y finas; textos con sombra suave para leerse sobre video claro */
.stage.full .gflecha.otra{opacity:.78}
.vivohud .vtxt,.vivohud .vsub,.vivohud .vdist{text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.85)}.vflecha svg,.vz svg{width:100%;height:100%;display:block}
.vz{color:#ffd60a}.vivohud[data-zoom=alejate] .vz{color:#64d2ff}

.vring{width:110px;height:110px;border-radius:50%;border:9px solid #30d158;box-shadow:0 0 0 3px #000,0 0 26px #30d158,inset 0 0 0 3px #000;display:flex;align-items:center;justify-content:center;font-size:52px;color:#30d158;font-weight:900;text-shadow:0 0 4px #000;animation:vlate 1s ease-in-out infinite}
@keyframes vlate{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.vaquit{margin-top:8px;background:#30d158;color:#06210f;font-weight:900;font-size:24px;padding:6px 16px;border-radius:999px;box-shadow:0 0 0 2px #000}
.vbot{position:absolute;left:0;right:0;bottom:0;padding:26px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.84) 28%);text-align:center}
.vtxt{font-size:27px;font-weight:900;line-height:1.15;text-shadow:0 2px 5px #000}.vsub{font-size:15.5px;font-weight:700;margin-top:3px;text-shadow:0 1px 3px #000}
.vdist{font-size:17px;font-weight:850;margin-top:6px;color:#ffd60a}.vivohud[data-zoom=ok] .vdist{color:#30d158}.vivohud[data-zoom=sinEscala] .vdist{color:#ddd;font-weight:650;font-size:14px}
.vrow{display:flex;gap:8px;justify-content:center;margin-top:8px}.vrow button{flex:0 1 auto;min-width:64px}
.vnota{font-size:12px;opacity:.85;margin-top:6px;line-height:1.3}
.vivohud[data-estado=aqui] .vtxt{color:#30d158}.vivohud[data-estado=pasaste] .vtxt{color:#ffd60a}.vivohud[data-estado=cerca] .vtxt{color:#a8f0b8}
.hidden{display:none!important}
#toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);font-weight:750;padding:13px 20px;border-radius:999px;display:none;z-index:30;box-shadow:var(--sh2);max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){*,*::before{animation-duration:.001s!important;transition:none!important}.garrow,.ring{animation-duration:1s!important}}
@media (min-width:700px){.share{grid-template-columns:repeat(3,1fr)}}
.temaSlot,.i18nSlot{display:contents}
header .i18nBtn{width:40px;min-width:40px;height:44px;min-height:44px;padding:0!important;font-size:19px;margin:0}
/* con 🌐 hay un botón más arriba: en teléfonos angostos se quita el logo y el subtítulo para que el título quepa en una sola fila */
@media (max-width:440px){header{gap:5px}header>div:first-child{display:none}header h1{font-size:14.5px;line-height:1.1}header h1 small{display:none}header h1{min-width:58px}header .rolb{max-width:118px;overflow:hidden;text-overflow:ellipsis}}
/* 🌐 carpetas: etapas, códigos, fotos (fto-v10) */
.etn{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;border-radius:999px;background:var(--acc);color:var(--on-acc);font-weight:900;font-size:17px;margin-right:4px}
.carpeta.otra .etn{background:var(--sec);color:var(--sec-tx)}

.codtag{border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:650;min-height:32px;box-shadow:none}.codtag.hit{outline:2px solid var(--acc)}
.sintr{font-size:12px}
.sfgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.sfit{margin:0;cursor:pointer}.sfit img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:var(--inset);display:block;border:1px solid var(--line)}
.sfit figcaption{font-size:12.5px;color:var(--mut);margin-top:3px;overflow-wrap:anywhere;line-height:1.3}

.sfvisor .sfin{background:var(--card);color:var(--tx);border-radius:16px;padding:12px;max-width:min(96vw,900px);max-height:94vh;overflow:auto;width:100%}
.sfvisor img{width:100%;max-height:68vh;object-fit:contain;border-radius:10px;background:#000;display:block}.sfcap{font-weight:700;margin-top:8px;overflow-wrap:anywhere}
header .temaBtn{width:40px;min-width:40px;height:44px;min-height:44px;padding:0!important;font-size:19px;margin:0}

<body>
<header>
  <div style="font-size:26px" aria-hidden="true">📐</div>
  <h1 id="htitle">Field to Office<small id="hsub">Guía de campo de drywall</small></h1>
  <span class="temaSlot" data-tema-slot="sec sm"></span>
  <span class="i18nSlot" data-i18n-slot="sec sm"></span>
  <button class="sec sm" id="btnModo">🏢 Oficina</button>
</header>
<main id="app"></main>
<div id="toast"></div>
<script src="specs.js"></script>
<script src="roles.js"></script>
<script src="marcas.js"></script>
<script src="guia.js"></script>
<script src="voz.js"></script>
<script src="specfotos.js"></script>
<script>
/* ===== Field to Office - prototipo =====
   Datos guardados en el teléfono (localStorage; las fotos de “📸 Marcar reparaciones” en IndexedDB, ver marcas.js). El proyecto de ejemplo viene de documentos reales SIN nombres ni códigos; lo que falta dice "Pendiente". */
const LS='fto_data_v1', LSPIN='fto_pin_hash', LSPROJ='fto_proj';
const TIPOS={pared:'Pared / Assembly',firewall:'Fire wall',shaft:'Shaft',rc1:'RC1 channel'};
const EJ_VER=2, PEND='Pendiente: falta en los documentos';
function ejemplo(){
 const T='5/8" Type X (todo el drywall es 5/8" Type X)';
 const TORN='Type S para metal liviano (light-gauge). Studs más pesados: tornillo más pesado. Rosca fina (fine thread) para placas sound-damping. (Spec 092900) · Medida/largo: '+PEND;
 const PAT='Separación en orillas y en el campo: '+PEND+'. Distancia del tornillo a la orilla: seguir las reglas de la spec 092900.';
 const RATED='Muro con rating: continuo de piso a piso (floor to floor). Sellar TODAS las penetraciones con fire caulk.';
 const NOTA='EJEMPLO – no usar en obra. Datos tomados de documentos reales (hoja de tipos de partición y spec 092900), sin nombres ni códigos del proyecto. Lo que dice "Pendiente" NO está en los documentos: no adivinar.';
 return {id:'ejemplo',ver:EJ_VER,nombre:'PROYECTO DE EJEMPLO',ejemplo:true,
 guiaCodigo:'En la hoja de tipos de partición, cada dígito del código del muro dice algo: 1) material · 2) horas de rating · 3) ancho del stud · 4) capas de drywall · 5) condición especial (resilient channel o tile backer).',
 fichas:[
 {id:'A',tipo:'pared',nombre:'Muro tipo A (EJEMPLO) – metal stud',rating:'Según el dígito de horas del código (ver hoja de tipos)',capas:T+'. Número de capas: lo dice el dígito de capas del código.',dobleCapa:'Solo si la hoja de tipos muestra 2 capas',tornillo:TORN,patron:PAT,metal:'Metal stud @ 16" o.c. Ancho del stud: lo dice el código. Calibre: '+PEND,aislamiento:PEND,ul:PEND,notas:NOTA,adj:[]},
 {id:'1H',tipo:'firewall',nombre:'Muro 1 hora (EJEMPLO) – con rating',rating:'1 hora',capas:T+'. Número de capas: lo dice el dígito de capas del código.',dobleCapa:'Solo donde la hoja de tipos muestra 2 capas',tornillo:TORN,patron:PAT,metal:'Metal stud @ 16" o.c. Ancho del stud: lo dice el código. Calibre: '+PEND,aislamiento:PEND,ul:PEND,alerta:RATED,notas:NOTA,adj:[]},
 {id:'2H',tipo:'firewall',nombre:'Muro 2 horas (EJEMPLO) – doble capa',rating:'2 horas',capas:T+'. La hoja de tipos muestra 2 capas.',dobleCapa:'Sí – donde la hoja de tipos muestra 2 capas (fire-rated)',tornillo:TORN,patron:PAT,metal:'Metal stud @ 16" o.c. Ancho del stud: lo dice el código. Calibre: '+PEND,aislamiento:PEND,ul:PEND,alerta:RATED+' Doble capa donde lo muestra la hoja.',notas:NOTA,adj:[]},
 {id:'SH2',tipo:'shaft',nombre:'Shaft 2 horas (EJEMPLO)',rating:'2 horas',capas:T+'. Detalle de capas del shaft: '+PEND,dobleCapa:'Solo donde la hoja de tipos muestra 2 capas',tornillo:TORN,patron:PAT,metal:'Shaft wall studs @ 24" o.c. Ancho del stud: lo dice el código. Perfil y calibre: '+PEND,aislamiento:PEND,ul:PEND,alerta:RATED+' Shaft studs a 24" o.c. (no 16").',notas:NOTA,adj:[]},
 {id:'RC1',tipo:'rc1',nombre:'Condición especial: resilient channel (EJEMPLO)',rating:'Según el código del muro donde va',capas:T,dobleCapa:'Solo donde la hoja de tipos muestra 2 capas',tornillo:'Detalle de tornillo al channel: '+PEND+'. (Spec 092900: rosca fina para placas sound-damping.)',patron:'Separación del channel y de los tornillos: '+PEND,metal:'Resilient channel (RC1): '+PEND,aislamiento:PEND,ul:PEND,alerta:'Detalles del RC1 NO están en los documentos. Pedir el detalle a la oficina antes de instalar.',notas:'El último dígito del código marca condición especial: resilient channel o tile backer. '+NOTA,adj:[]}
 ],
 unidades:[
 {unidad:'201',piso:'2',fichas:['A','1H','SH2']},
 {unidad:'202',piso:'2',fichas:['A','1H','RC1']},
 {unidad:'301',piso:'3',fichas:['A','2H','SH2']},
 {unidad:'Pasillo piso 2',piso:'2',fichas:['2H']}
 ]};}
let data=load(), modo='campo', vista={pantalla:'inicio'}, admin=false;
function load(){try{const d=JSON.parse(localStorage.getItem(LS));if(d&&d.length){/* reemplaza el ejemplo viejo (ficticio) por el nuevo */const i=d.findIndex(x=>x&&x.id==='ejemplo');if(i>=0&&(d[i].ver||1)<EJ_VER){d[i]=ejemplo();try{localStorage.setItem(LS,JSON.stringify(d))}catch(e){}}return d}}catch(e){}return [ejemplo()]}
function save(){try{localStorage.setItem(LS,JSON.stringify(data))}catch(e){alert('No hay espacio en el teléfono para guardar. Usa fotos más pequeñas.')}}
function proj(){const id=localStorage.getItem(LSPROJ);return data.find(p=>p.id===id)||data[0]}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('fto:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function tagTipo(t){const c={firewall:'fw',shaft:'sh',rc1:'rc'}[t]||'';return `<span class="tag ${c}">${esc(TIPOS[t]||t)}</span>`}
const $=id=>document.getElementById(id);
function val(v){return esc(v).split(PEND).join(`<span class="pend">⏳ ${PEND}</span>`)}

function render(){
 camStop();
 const p=proj(); $('hsub').textContent=(p?p.nombre:'')+(modo==='oficina'?' · Oficina':' · Campo');
 $('btnModo').textContent=modo==='oficina'?'👷 Campo':'🏢 Oficina';
 const a=$('app'); a.innerHTML=modo==='oficina'?vOficina(p):vCampo(p); window.scrollTo(0,0);
 const q=$('q'); if(q){q.value=vista.q||'';q.oninput=()=>{vista.q=q.value;$('res').innerHTML=resultados(p,q.value)};}
 const qs=$('qs'); if(qs){qs.value=vista.qs||'';qs.oninput=()=>{vista.qs=qs.value;$('sres').innerHTML=specRes(qs.value)};}
 const qc=$('qc'); if(qc){qc.value=vista.qc||'';qc.oninput=()=>{vista.qc=qc.value;$('cres').innerHTML=carpRes(carp(vista.cid),qc.value);const cd=$('codigos');if(cd){const o=cd.open;cd.outerHTML=codHTML(carp(vista.cid),qc.value)||'';const n=$('codigos');if(n&&o)n.open=true}}}
 const qd=$('qd'); if(qd){qd.value=vista.qc||vista.qs||'';qd.oninput=()=>docBuscar(qd.value);}
 despuesRender();
}
/* ---------- CAMPO ---------- */
function vCampo(p){
 if(!p)return '<div class="card">No hay proyectos. Pide el enlace a la oficina.</div>';
 if(vista.pantalla==='ficha')return vFicha(p,vista.id);
 if(vista.pantalla==='unidad')return vUnidad(p,vista.id);
 if(vista.pantalla==='carpetas')return vCarpetas();
 if(vista.pantalla==='carpeta')return vCarpeta(vista.cid);
 if(vista.pantalla==='doc')return vDoc(vista.cid,vista.di);
 if(vista.pantalla==='form')return vForm(p,vista.tipo);
 if(vista.pantalla==='reporte')return vReporte(vista.rid);
 const vm=rutaMarcas(p);if(vm!==null)return vm;
 const lado=vista.lado==='para'?'para':'de';
 return `${p.ejemplo?'<div class="ej">⚠️ EJEMPLO – no usar en obra<br><span style="font-weight:600">Datos de documentos reales sin nombres. Lo que dice “Pendiente” falta en los documentos.</span></div>':''}
 ${data.length>1?`<select onchange="localStorage.setItem(LSPROJ,this.value);vista={pantalla:'inicio'};render()">${data.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select>`:''}
 <div class="tabs dir"><button id="tabDe" class="${lado==='de'?'on':'off'}" onclick="vista={pantalla:'inicio',lado:'de'};render()">⬇️ De la oficina</button><button id="tabPara" class="${lado==='para'?'on':'off'}" onclick="vista={pantalla:'inicio',lado:'para'};render()">⬆️ Para la oficina</button></div>
 ${lado==='para'?vPara(p):vDe(p)}
 ${vModulos('campo')}`;
}
/* Oficina → Campo: lo que la oficina prepara (carpetas, fichas, unidades) */
function vDe(p){
 return `<div class="mut dirnota" id="notaDe">Lo que la oficina prepara para ti: especificaciones, tipos de pared, shafts, fire walls, RC1 y unidades.</div>
 ${hayS()?`<div class="card list-item" id="btnCarpetas" onclick="vista={pantalla:'carpetas'};render()"><b>📁 Carpetas de especificaciones</b><div class="mut" data-noi18n>${SL().map(c=>esc(nomCarpeta(c))).join(' → ')}</div><div class="mut">Del proyecto del usuario: revisar antes de usar en obra</div></div>`:''}
 ${p.guiaCodigo?`<details class="card"><summary><b>🔢 Cómo leer el código del muro</b></summary><p>${esc(p.guiaCodigo)}</p></details>`:''}
 <label>🔎 Busca por unidad, piso o tipo de pared</label>
 <input id="q" placeholder="Ej: 201, 1 hora, fire, shaft, RC1" autocomplete="off">
 <div id="res">${resultados(p,vista.q||'')}</div>
 ${secMarcas(p,'de')}`;
}
function resultados(p,q){
 q=(q||'').toLowerCase().trim();
 const us=p.unidades.filter(u=>!q||u.unidad.toLowerCase().includes(q)||('piso '+u.piso).includes(q)||(u.piso+'fl').includes(q.replace(/\s/g,'')));
 const fs=p.fichas.filter(f=>!q||[f.id,f.nombre,TIPOS[f.tipo],f.tipo,f.rating].join(' ').toLowerCase().includes(q));
 let h='';
 if(us.length)h+=`<h3>🏠 Unidades</h3>`+us.map(u=>`<div class="card list-item" onclick="vista={pantalla:'unidad',id:'${esc(u.unidad)}',q:vista.q};render()"><div class="big">${esc(u.unidad)}</div><div class="mut">Piso ${esc(u.piso)} · ${u.fichas.length} fichas</div>${(n=>n?`<span class="tag mtag">📸 ${n} punto${n===1?'':'s'}</span>`:'')(ptsUnidad(p.id,u.unidad).length)}</div>`).join('');
 if(fs.length)h+=`<h3>🧱 Tipos de pared</h3>`+fs.map(f=>`<div class="card list-item" onclick="vista={pantalla:'ficha',id:'${esc(f.id)}',q:vista.q};render()"><div class="big">${esc(f.id)}</div>${tagTipo(f.tipo)}<div>${esc(f.nombre)}</div></div>`).join('');
 return h||'<div class="card mut">No se encontró nada. Prueba con otro número o tipo.</div>';
}
function vUnidad(p,id){const u=p.unidades.find(x=>x.unidad===id);if(!u)return '';
 return `<button class="sec sm" onclick="vista={pantalla:'inicio',q:vista.q};render()">← Volver</button>
 ${p.ejemplo?'<div class="ej">⚠️ EJEMPLO – no usar en obra</div>':''}
 <div class="card"><div class="big">${esc(uLabel(u.unidad))}</div><div class="mut">Piso ${esc(u.piso)}</div>
 ${(pts=>`<p style="margin-bottom:0"><button id="btnMarcasUnidad" data-u="${esc(u.unidad)}" onclick="irMarcasU(this.dataset.u,'unidad')">📸 Marcar / ver reparaciones</button></p>${pts.length?`<div style="margin-top:6px">${chipsConteo(pts)}</div>`:''}`)(ptsUnidad(p.id,u.unidad))}</div>
 <h3>Paredes de esta unidad</h3>`+u.fichas.map(fid=>{const f=p.fichas.find(x=>x.id===fid);return f?`<div class="card list-item" onclick="vista={pantalla:'ficha',id:'${esc(f.id)}',desde:'${esc(u.unidad)}',q:vista.q};render()"><div class="big">${esc(f.id)}</div>${tagTipo(f.tipo)}<div>${esc(f.nombre)}</div>${f.dobleCapa&&/^s[ií]/i.test(f.dobleCapa)?'<div class="alerta">⚠️ Lleva DOBLE CAPA</div>':''}</div>`:''}).join('');
}
function vFicha(p,id){const f=p.fichas.find(x=>x.id===id);if(!f)return '';
 const back=vista.desde?`vista={pantalla:'unidad',id:'${esc(vista.desde)}',q:vista.q}`:`vista={pantalla:'inicio',q:vista.q}`;
 const filas=[['Rating de fuego',f.rating],['Capas de drywall',f.capas],['¿Doble capa? ¿Dónde?',f.dobleCapa],['Tipo de tornillo',f.tornillo],['Patrón de tornillos',f.patron],['Metal / studs',f.metal],['Aislamiento',f.aislamiento],['Número UL / GA',f.ul]];
 const enU=p.unidades.filter(u=>u.fichas.includes(f.id)).map(u=>`<span class="tag">${esc(u.unidad)}</span>`).join('');
 return `<button class="sec sm" onclick="${back};render()">← Volver</button>
 ${p.ejemplo?'<div class="ej">⚠️ EJEMPLO – no usar en obra</div>':''}
 <div class="card"><div class="big">${esc(f.id)}</div>${tagTipo(f.tipo)}<h3 style="margin-top:6px">${esc(f.nombre)}</h3>
 ${f.alerta?`<div class="alerta">⚠️ ${esc(f.alerta)}</div>`:''}
 <div class="spec">${filas.filter(r=>r[1]).map(r=>`<div>${r[0]}</div><div>${val(r[1])}</div>`).join('')}</div>
 ${f.notas?`<p>📝 ${esc(f.notas)}</p>`:''}
 ${enU?`<div class="mut">Se usa en:</div>${enU}`:''}
 ${(f.adj||[]).map(x=>x.tipo==='pdf'?`<p><a class="btn" href="${x.data}" download="${esc(x.nombre)}" target="_blank">📄 Abrir ${esc(x.nombre)}</a></p>`:`<img class="adj" src="${x.data}" alt="${esc(x.nombre)}">`).join('')}
 </div>`;
}
/* ---------- CARPETAS DE ESPECIFICACIONES (solo texto, de specs.js) ----------
   Orden por secuencia de obra (c.etapa 1-5; 0 = otras) y los códigos de cada oficio dentro de su carpeta (c.codigos).
   🌐 Traducción: specs.js es el texto base (español). Las traducciones están en specs_<idioma>.js y se cargan solo al escoger
   ese idioma (el service worker las guarda al usarlas). Los códigos, números y normas no cambian. Manda el original en inglés. */
const SBAN='<div class="ej">⚠️ DEL PROYECTO DEL USUARIO – revisar antes de usar en obra<br><span style="font-weight:600">Texto limpio de las especificaciones (sin PDFs ni nombres). Lo marcado “Pendiente / faltantes” NO está en los documentos: no adivinar.</span></div>';
const SBAN1='<div class="ej">⚠️ DEL PROYECTO DEL USUARIO – revisar antes de usar en obra</div>';
const SPECS_TR=window.SPECS_TR||(window.SPECS_TR={}), SPECS_IDI=['en','pt','ht','fr','ru','uk'], specCarga={};
function idi(){return window.I18N?I18N.lang:'es'}
function cargarTr(l){if(SPECS_TR[l]||specCarga[l]==='cargando'||!SPECS_IDI.includes(l))return;specCarga[l]='cargando';
 const s=document.createElement('script');s.src='specs_'+l+'.js?v='+SPECS_VER;
 s.onload=()=>{specCarga[l]=SPECS_TR[l]?'ok':'error';if(idi()===l&&modo==='campo'&&/^(inicio|carpetas|carpeta|doc)$/.test(vista.pantalla))render()};
 s.onerror=()=>{specCarga[l]='error';s.remove();if(idi()===l&&modo==='campo'&&/^(carpetas|carpeta|doc)$/.test(vista.pantalla))render()};
 document.head.appendChild(s)}
function trS(){const l=idi();if(l==='es')return null;const T=SPECS_TR[l];if(!T){cargarTr(l);return null}return T}
let _SL={};
/* SPECS en el idioma escogido (lo que no tenga traducción queda en el texto base, marcado) */
function SL(){if(!hayS())return [];const l=idi(),T=trS(),k=l+(T?'+':'-')+SF.length;if(_SL.k===k)return _SL.v;
 const v=SPECS.map(c=>({...c,nombre:(T&&T.carpetas&&T.carpetas[c.id])||c.nombre,faltantes:T&&T.faltantes&&T.faltantes[c.id]!=null?T.faltantes[c.id]:c.faltantes,ftr:!T||!c.faltantes||!!(T.faltantes&&T.faltantes[c.id]),

 return bloques.filter(b=>b.pares.length).map(b=>{const g=k=>{const x=b.pares.find(p=>p[0]===k);return x?x[1]:''};
  const tn=nrm(g('Tipo')),tipo=Object.keys(RT).find(k=>IDIS.some(l=>nrm(T_(RT[k].corto,l))===tn))||'otro';

 return `<button class="sec sm" onclick="vista={pantalla:'inicio'};render()">← Volver</button>
 <div class="card"><h3>${id?'Editar unidad':'Nueva unidad'}</h3>
 <label>Unidad (número o nombre)</label><input id="u_n" value="${esc(u.unidad)}"><label>Piso</label><input id="u_p" value="${esc(u.piso)}" inputmode="numeric">
 <label>Paredes / fichas que lleva</label>${p.fichas.map(f=>`<label style="color:var(--tx)"><input type="checkbox" style="width:auto" class="u_f" value="${esc(f.id)}" ${u.fichas.includes(f.id)?'checked':''}> ${esc(f.id)} – ${esc(f.nombre)}</label>`).join('')}
 <div class="row" style="margin-top:14px"><button onclick="guardarUnidad('${esc(id||'')}')">💾 Guardar</button>${id?`<button class="red" onclick="borrarUnidad('${esc(id)}')">Borrar</button>`:''}</div></div>`;}
function guardarUnidad(id){const p=proj(),n=$('u_n').value.trim();if(!n)return alert('Pon el número de unidad.');
 if(n!==id&&p.unidades.some(x=>x.unidad===n))return alert('Esa unidad ya existe.');
 const o={unidad:n,piso:$('u_p').value.trim(),fichas:[...document.querySelectorAll('.u_f:checked')].map(x=>x.value)};
 const u=p.unidades.find(x=>x.unidad===id);if(u)Object.assign(u,o);else p.unidades.push(o);save();toast('Unidad guardada');vista={pantalla:'inicio'};render()}
function borrarUnidad(id){if(!confirm('¿Borrar la unidad '+id+'?'))return;const p=proj();p.unidades=p.unidades.filter(x=>x.unidad!==id);save();vista={pantalla:'inicio'};render()}
function nuevoProyecto(){const n=prompt('Nombre del proyecto nuevo:');if(!n)return;const id='p'+Date.now().toString(36);data.push({id,nombre:n,fichas:[],unidades:[]});localStorage.setItem(LSPROJ,id);save();render()}
function borrarProyecto(){const p=proj();if(!confirm('¿Borrar el proyecto "'+p.nombre+'" de este teléfono?'))return;data=data.filter(x=>x!==p);if(!data.length)data=[ejemplo()];localStorage.removeItem(LSPROJ);save();render()}
/* enlace: proyecto sin archivos, comprimido en el #hash */
async function comprimir(s){const cs=new Blob([s]).stream().pipeThrough(new CompressionStream('deflate-raw'));const b=new Uint8Array(await new Response(cs).arrayBuffer());let t='';b.forEach(x=>t+=String.fromCharCode(x));return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function descomprimir(s){const t=atob(s.replace(/-/g,'+').replace(/_/g,'/'));const b=Uint8Array.from(t,c=>c.charCodeAt(0));const ds=new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return await new Response(ds).text()}
async function compartir(){const p=proj();const c=JSON.parse(JSON.stringify(p));c.fichas.forEach(f=>f.adj=[]);
 const url=location.origin+location.pathname+'#p='+await comprimir(JSON.stringify(c));
 const msg='Guía de campo – '+p.nombre+': '+url;
 $('enl').innerHTML=`<textarea readonly style="margin-top:8px">${esc(url)}</textarea><div class="row" style="margin-top:8px"><button class="sm" onclick="navigator.clipboard.writeText(${esc(JSON.stringify(url))}).then(()=>toast('Copiado'))">📋 Copiar</button><a class="btn sm" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank">WhatsApp</a><a class="btn sm" href="sms:?&body=${encodeURIComponent(msg)}">SMS</a></div>`;}
async function leerEnlace(){const m=location.hash.match(/^#p=(.+)$/);if(!m)return;
 try{let p=JSON.parse(await descomprimir(m[1]));if(!p||!p.id||!Array.isArray(p.fichas))throw 0;
  if(p.id==='ejemplo'&&(p.ver||1)<EJ_VER)p=ejemplo();
  const i=data.findIndex(x=>x.id===p.id);if(i>=0){p.fichas.forEach(f=>{const old=data[i].fichas.find(o=>o.id===f.id);if(old)f.adj=old.adj||[]});data[i]=p}else data.push(p);
  localStorage.setItem(LSPROJ,p.id);save();toast('Proyecto recibido: '+p.nombre)}catch(e){alert('El enlace no es válido o está incompleto.')}
 history.replaceState(null,'',location.pathname)}
/* respaldo: proyectos + 🖼️ fotos de las carpetas (formato 2). Sigue leyendo los respaldos viejos (solo la lista de proyectos). */
async function respaldoObj(){return {app:'field-to-office',formato:2,proyectos:data,specFotos:await sfRespaldo()}}
async function exportar(){const o=await respaldoObj();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='field-to-office-respaldo.json';a.click()}
async function importarObj(d){const pr=Array.isArray(d)?d:(d&&Array.isArray(d.proyectos)?d.proyectos:null);if(!pr)throw 0;data=pr;save();
 const n=d&&d.specFotos?await sfRestaurar(d.specFotos):0;toast(n?'Importado · '+n+' fotos':'Importado');render()}
function importar(inp){const fr=new FileReader();fr.onload=async()=>{try{await importarObj(JSON.parse(fr.result))}catch(e){alert('Archivo no válido')}};fr.readAsText(inp.files[0])}
$('btnModo').onclick=()=>{modo=modo==='oficina'?'campo':'oficina';vista={pantalla:'inicio'};render()};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
/* 🌐 al cambiar de idioma: la pantalla se traduce sola; las que arman texto (carpetas, mensaje) se vuelven a dibujar */
if(window.I18N)I18N.onChange(l=>{_SL={};if(l!=='es')cargarTr(l);if(!/^(marcar|verCap)$/.test(vista.pantalla))render()});
if(window.I18N&&I18N.lang!=='es')cargarTr(I18N.lang);
sfCargar().then(()=>{if(/^(carpetas|carpeta|doc)$/.test(vista.pantalla))render()});
leerEnlace().then(render);
</script>
