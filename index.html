<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Field to Office</title>
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#111;--card:#1d1d1d;--line:#333;--tx:#f2f2f2;--mut:#aaa;--acc:#ff8a00;--ok:#2fbf71;--warn:#ffcc00;--red:#ff4d4d}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:17px}
header{position:sticky;top:0;background:#000;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--acc);z-index:5}
header h1{font-size:19px;margin:0;flex:1}header small{color:var(--mut);display:block;font-weight:400;font-size:12px}
main{padding:14px;max-width:760px;margin:auto;padding-bottom:80px}
button,.btn{background:var(--acc);color:#000;border:0;border-radius:10px;padding:12px 14px;font-size:16px;font-weight:700;cursor:pointer}
button.sec{background:#333;color:var(--tx)}button.red{background:var(--red);color:#fff}button.sm{padding:7px 10px;font-size:14px}
input,select,textarea{width:100%;background:#000;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px}
textarea{min-height:70px}label{display:block;margin:10px 0 4px;color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h3{margin:0 0 6px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.tag{display:inline-block;background:#333;border-radius:20px;padding:3px 10px;margin:2px;font-size:13px}
.tag.fw{background:#5a1a1a;color:#ffb3b3}.tag.sh{background:#1a3a5a;color:#b3d9ff}.tag.rc{background:#3a3a1a;color:#ffe9a3}
.ej{background:var(--warn);color:#000;font-weight:800;text-align:center;padding:6px;border-radius:8px;margin:8px 0;font-size:14px}
.big{font-size:22px;font-weight:800}.mut{color:var(--mut);font-size:14px}
.spec{display:grid;grid-template-columns:42% 58%;gap:0;border-top:1px solid var(--line);margin-top:8px}
.spec div{padding:9px 6px;border-bottom:1px solid var(--line)}.spec div:nth-child(odd){color:var(--mut);font-size:14px}
.spec div:nth-child(even){font-weight:700}
.pend{color:var(--warn);font-style:italic}
.alerta{background:#3d0d0d;border-left:5px solid var(--red);padding:10px;border-radius:8px;margin:8px 0;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1}
.list-item{cursor:pointer}.list-item:active{background:#262626}
img.adj{max-width:100%;border-radius:10px;margin-top:8px;border:1px solid var(--line)}
.doc{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.45;overflow-wrap:anywhere;background:#000;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px}
mark{background:var(--acc);color:#000;border-radius:3px;padding:0 1px}.nf{color:var(--warn);font-weight:700}
.faltan{background:#2e2700;border:2px dashed var(--warn);border-radius:12px;padding:12px;margin:10px 0}.faltan h3{color:var(--warn);margin:0 0 6px}
.snip{font-size:13px;color:var(--mut);margin-top:4px;overflow-wrap:anywhere}
.tabs.dir{margin:10px 0 6px}.tabs.dir button{padding:12px 6px;font-size:15px}.tabs button.off{background:#333;color:var(--tx)}
.dirnota{margin:0 2px 8px}.tag.okt{background:#123d26;color:#a6f0c6}.tag.pen{background:#3d3100;color:#ffe48a}
.share{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.share>*{text-align:center;text-decoration:none}
.atendido{opacity:.55}
.modulos{margin-top:22px;border-top:1px solid var(--line);padding-top:6px}.modcard{display:block;text-decoration:none;color:var(--tx);border-left:5px solid var(--acc)}.modcard .ext{float:right;color:var(--acc);font-size:14px;font-weight:700}
.modnota{background:#10233a;border-left:5px solid #4da3ff;padding:10px;border-radius:8px;margin:8px 0}
.stagewrap{width:100%;margin:8px 0}.stage{position:relative;margin:0 auto;background:#000;border-radius:12px;touch-action:manipulation;user-select:none;-webkit-user-select:none;border:1px solid var(--line);width:100%;height:240px}
.stage video,.stage canvas,.stage img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:12px}.stage .dots{position:absolute;inset:0;pointer-events:none}
.dot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #000,0 2px 6px rgba(0,0,0,.7);font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;line-height:1}
.cammsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:#fff;background:rgba(0,0,0,.65);font-weight:700;font-size:15px}
.badge{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.7);color:#fff;font-size:13px;font-weight:700;padding:4px 8px;border-radius:8px;pointer-events:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;-webkit-overflow-scrolling:touch}.chiprep{flex:0 0 auto;background:#222;border:3px solid #444;color:var(--tx);border-radius:22px;padding:8px 12px;font-size:14px;font-weight:700}.chiprep.sel{border-color:#fff;background:#3a3a3a}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:5px;border:2px solid #fff;flex:0 0 auto}.sw.big{width:24px;height:24px}
.leyrow{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.leyrow>div{flex:1}.pitem{padding:8px 4px;border-bottom:1px solid var(--line)}
img.thumb{width:96px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#000}.secmarcas{border-left:5px solid #ff3b30}
.guiaov{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:12px;z-index:3}
.gflecha{position:absolute;pointer-events:auto;display:flex;align-items:center;gap:3px;cursor:pointer}.gflecha .glbl{width:max-content;max-width:150px}
.garrow{width:58px;height:58px;flex:0 0 auto;filter:drop-shadow(0 0 3px #000) drop-shadow(0 0 6px rgba(0,0,0,.8));animation:empuje 1s ease-in-out infinite}.garrow svg{width:100%;height:100%;display:block}
@keyframes empuje{0%,100%{opacity:1}50%{opacity:.6}}
.glbl{background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:700;padding:4px 7px;border-radius:8px;text-align:center;line-height:1.25}
.gnum{display:inline-block;min-width:20px;height:20px;padding:0 3px;border-radius:10px;border:2px solid #fff;margin-right:3px;text-align:center;line-height:16px;font-weight:900}
.ring{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #000;animation:pulso 1.2s ease-out infinite;pointer-events:none;z-index:2}.ring.r2{animation-delay:.6s}
@keyframes pulso{0%{transform:scale(1);opacity:1}100%{transform:scale(3);opacity:0}}
.dot.objetivo{z-index:3}#guiaInfo{font-weight:700;color:var(--tx);margin-top:6px}#guiaCtl select{flex:1 1 auto}
.microw{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}.mic.on{background:#ff3b30;color:#fff;border-color:#ff3b30}.micst{color:#ff6b6b;font-weight:700}.michint{font-size:13px}
.rolb{background:#333;color:var(--tx);border:2px solid #666;border-radius:20px;padding:5px 10px;font-size:13px;font-weight:800;white-space:nowrap}.rolb.sup{background:var(--ok);color:#000;border-color:var(--ok)}
button:disabled{opacity:.4;cursor:not-allowed}.big1{width:100%;font-size:20px;padding:16px}button.buscar{background:#0a84ff;color:#fff}
.rolaviso{background:#2e2700;border:2px dashed var(--warn);border-radius:12px;padding:10px;margin:8px 0;display:flex;flex-direction:column;gap:8px}.rolaviso b{color:var(--warn)}
.rolmsg{color:#ff8080;font-weight:700;min-height:22px;margin-top:8px}.pinin{font-size:26px;letter-spacing:8px;text-align:center}
.buscatit{font-size:20px;font-weight:800;margin:8px 0 2px}
.guiabar{display:flex;gap:8px;margin:6px 0}.guiabar button{font-size:22px;padding:16px 10px}.guiabar #btnGuiar{flex:1;font-size:21px}.guiabar #btnGuiaAntC,.guiabar #btnGuiaSigC{flex:0 0 22%}#btnGuiar.on{background:#30d158}
.hidden{display:none!important}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ok);color:#000;font-weight:700;padding:10px 16px;border-radius:10px;display:none;z-index:9}
</style>
</head>
<body>
<header>
  <div style="font-size:26px">📐</div>
  <h1 id="htitle">Field to Office<small id="hsub">Guía de campo de drywall</small></h1>
  <button class="sec sm" id="btnModo">🏢 Oficina</button>
</header>
<main id="app"></main>
<div id="toast"></div>
<script src="specs.js"></script>
<script src="roles.js"></script>
<script src="marcas.js"></script>
<script src="guia.js"></script>
<script src="voz.js"></script>
<script>
/* ===== Field to Office - prototipo =====
   Datos guardados en el teléfono (localStorage; las fotos de “📸 Marcar reparaciones” en IndexedDB, ver marcas.js). El proyecto de ejemplo viene de documentos reales SIN nombres ni códigos; lo que falta dice "Pendiente". */
const LS='fto_data_v1', LSPIN='fto_pin_hash', LSPROJ='fto_proj';
const TIPOS={pared:'Pared / Assembly',firewall:'Fire wall',shaft:'Shaft',rc1:'RC1 channel'};
const EJ_VER=2, PEND='Pendiente: falta en los documentos';
function ejemplo(){
 const T='5/8" Type X (todo el drywall es 5/8" Type X)';
 const TORN='Type S para metal liviano (light-gauge). Studs más pesados: tornillo más pesado. Rosca fina (fine thread) para placas sound-damping. (Spec 092900) · Medida/largo: '+PEND;
 const PAT='Separación en orillas y en el campo: '+PEND+'. Distancia del tornillo a la orilla: seguir las reglas de la spec 092900.';
 const RATED='Muro con rating: continuo de piso a piso (floor to floor). Sellar TODAS las penetraciones con fire caulk.';
 const NOTA='EJEMPLO – no usar en obra. Datos tomados de documentos reales (hoja de tipos de partición y spec 092900), sin nombres ni códigos del proyecto. Lo que dice "Pendiente" NO está en los documentos: no adivinar.';
 return {id:'ejemplo',ver:EJ_VER,nombre:'PROYECTO DE EJEMPLO',ejemplo:true,
 guiaCodigo:'En la hoja de tipos de partición, cada dígito del código del muro dice algo: 1) material · 2) horas de rating · 3) ancho del stud · 4) capas de drywall · 5) condición especial (resilient channel o tile backer).',
 fichas:[
 {id:'A',tipo:'pared',nombre:'Muro tipo A (EJEMPLO) – metal stud',rating:'Según el dígito de horas del código (ver hoja de tipos)',capas:T+'. Número de capas: lo dice el dígito de capas del código.',dobleCapa:'Solo si la hoja de tipos muestra 2 capas',tornillo:TORN,patron:PAT,metal:'Metal stud @ 16" o.c. Ancho del stud: lo dice el código. Calibre: '+PEND,aislamiento:PEND,ul:PEND,notas:NOTA,adj:[]},
 {id:'1H',tipo:'firewall',nombre:'Muro 1 hora (EJEMPLO) – con rating',rating:'1 hora',capas:T+'. Número de capas: lo dice el dígito de capas del código.',dobleCapa:'Solo donde la hoja de tipos muestra 2 capas',tornillo:TORN,patron:PAT,metal:'Metal stud @ 16" o.c. Ancho del stud: lo dice el código. Calibre: '+PEND,aislamiento:PEND,ul:PEND,alerta:RATED,notas:NOTA,adj:[]},
 {id:'2H',tipo:'firewall',nombre:'Muro 2 horas (EJEMPLO) – doble capa',rating:'2 horas',capas:T+'. La hoja de tipos muestra 2 capas.',dobleCapa:'Sí – donde la hoja de tipos muestra 2 capas (fire-rated)',tornillo:TORN,patron:PAT,metal:'Metal stud @ 16" o.c. Ancho del stud: lo dice el código. Calibre: '+PEND,aislamiento:PEND,ul:PEND,alerta:RATED+' Doble capa donde lo muestra la hoja.',notas:NOTA,adj:[]},
 {id:'SH2',tipo:'shaft',nombre:'Shaft 2 horas (EJEMPLO)',rating:'2 horas',capas:T+'. Detalle de capas del shaft: '+PEND,dobleCapa:'Solo donde la hoja de tipos muestra 2 capas',tornillo:TORN,patron:PAT,metal:'Shaft wall studs @ 24" o.c. Ancho del stud: lo dice el código. Perfil y calibre: '+PEND,aislamiento:PEND,ul:PEND,alerta:RATED+' Shaft studs a 24" o.c. (no 16").',notas:NOTA,adj:[]},
 {id:'RC1',tipo:'rc1',nombre:'Condición especial: resilient channel (EJEMPLO)',rating:'Según el código del muro donde va',capas:T,dobleCapa:'Solo donde la hoja de tipos muestra 2 capas',tornillo:'Detalle de tornillo al channel: '+PEND+'. (Spec 092900: rosca fina para placas sound-damping.)',patron:'Separación del channel y de los tornillos: '+PEND,metal:'Resilient channel (RC1): '+PEND,aislamiento:PEND,ul:PEND,alerta:'Detalles del RC1 NO están en los documentos. Pedir el detalle a la oficina antes de instalar.',notas:'El último dígito del código marca condición especial: resilient channel o tile backer. '+NOTA,adj:[]}
 ],
 unidades:[
 {unidad:'201',piso:'2',fichas:['A','1H','SH2']},
 {unidad:'202',piso:'2',fichas:['A','1H','RC1']},
 {unidad:'301',piso:'3',fichas:['A','2H','SH2']},
 {unidad:'Pasillo piso 2',piso:'2',fichas:['2H']}
 ]};}
let data=load(), modo='campo', vista={pantalla:'inicio'}, admin=false;
function load(){try{const d=JSON.parse(localStorage.getItem(LS));if(d&&d.length){/* reemplaza el ejemplo viejo (ficticio) por el nuevo */const i=d.findIndex(x=>x&&x.id==='ejemplo');if(i>=0&&(d[i].ver||1)<EJ_VER){d[i]=ejemplo();try{localStorage.setItem(LS,JSON.stringify(d))}catch(e){}}return d}}catch(e){}return [ejemplo()]}
function save(){try{localStorage.setItem(LS,JSON.stringify(data))}catch(e){alert('No hay espacio en el teléfono para guardar. Usa fotos más pequeñas.')}}
function proj(){const id=localStorage.getItem(LSPROJ);return data.find(p=>p.id===id)||data[0]}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('fto:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function tagTipo(t){const c={firewall:'fw',shaft:'sh',rc1:'rc'}[t]||'';return `<span class="tag ${c}">${esc(TIPOS[t]||t)}</span>`}
const $=id=>document.getElementById(id);
function val(v){return esc(v).split(PEND).join(`<span class="pend">⏳ ${PEND}</span>`)}

function render(){
 camStop();
 const p=proj(); $('hsub').textContent=(p?p.nombre:'')+(modo==='oficina'?' · Oficina':' · Campo');
 $('btnModo').textContent=modo==='oficina'?'👷 Campo':'🏢 Oficina';
 const a=$('app'); a.innerHTML=modo==='oficina'?vOficina(p):vCampo(p); window.scrollTo(0,0);
 const q=$('q'); if(q){q.value=vista.q||'';q.oninput=()=>{vista.q=q.value;$('res').innerHTML=resultados(p,q.value)};}
 const qs=$('qs'); if(qs){qs.value=vista.qs||'';qs.oninput=()=>{vista.qs=qs.value;$('sres').innerHTML=specRes(qs.value)};}
 despuesRender();
}
/* ---------- CAMPO ---------- */
function vCampo(p){
 if(!p)return '<div class="card">No hay proyectos. Pide el enlace a la oficina.</div>';
 if(vista.pantalla==='ficha')return vFicha(p,vista.id);
 if(vista.pantalla==='unidad')return vUnidad(p,vista.id);
 if(vista.pantalla==='carpetas')return vCarpetas();
 if(vista.pantalla==='carpeta')return vCarpeta(vista.cid);
 if(vista.pantalla==='doc')return vDoc(vista.cid,vista.di);
 if(vista.pantalla==='form')return vForm(p,vista.tipo);
 if(vista.pantalla==='reporte')return vReporte(vista.rid);
 const vm=rutaMarcas(p);if(vm!==null)return vm;
 const lado=vista.lado==='para'?'para':'de';
 return `${p.ejemplo?'<div class="ej">⚠️ EJEMPLO – no usar en obra<br><span style="font-weight:600">Datos de documentos reales sin nombres. Lo que dice “Pendiente” falta en los documentos.</span></div>':''}
 ${data.length>1?`<select onchange="localStorage.setItem(LSPROJ,this.value);vista={pantalla:'inicio'};render()">${data.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select>`:''}
 <div class="tabs dir"><button id="tabDe" class="${lado==='de'?'on':'off'}" onclick="vista={pantalla:'inicio',lado:'de'};render()">⬇️ De la oficina</button><button id="tabPara" class="${lado==='para'?'on':'off'}" onclick="vista={pantalla:'inicio',lado:'para'};render()">⬆️ Para la oficina</button></div>
 ${lado==='para'?vPara(p):vDe(p)}
 ${vModulos('campo')}`;
}
/* Oficina → Campo: lo que la oficina prepara (carpetas, fichas, unidades) */
function vDe(p){
 return `<div class="mut dirnota" id="notaDe">Lo que la oficina prepara para ti: especificaciones, tipos de pared, shafts, fire walls, RC1 y unidades.</div>
 ${hayS()?`<div class="card list-item" id="btnCarpetas" onclick="vista={pantalla:'carpetas'};render()"><b>📁 Carpetas de especificaciones</b><div class="mut">${SPECS.map(c=>esc(c.nombre)).join(' · ')}</div><div class="mut">Del proyecto del usuario: revisar antes de usar en obra</div></div>`:''}
 ${p.guiaCodigo?`<details class="card"><summary><b>🔢 Cómo leer el código del muro</b></summary><p>${esc(p.guiaCodigo)}</p></details>`:''}
 <label>🔎 Busca por unidad, piso o tipo de pared</label>
 <input id="q" placeholder="Ej: 201, 1 hora, fire, shaft, RC1" autocomplete="off">
 <div id="res">${resultados(p,vista.q||'')}</div>
 ${secMarcas(p,'de')}`;
}
function resultados(p,q){
 q=(q||'').toLowerCase().trim();
 const us=p.unidades.filter(u=>!q||u.unidad.toLowerCase().includes(q)||('piso '+u.piso).includes(q)||(u.piso+'fl').includes(q.replace(/\s/g,'')));
 const fs=p.fichas.filter(f=>!q||[f.id,f.nombre,TIPOS[f.tipo],f.tipo,f.rating].join(' ').toLowerCase().includes(q));
 let h='';
 if(us.length)h+=`<h3>🏠 Unidades</h3>`+us.map(u=>`<div class="card list-item" onclick="vista={pantalla:'unidad',id:'${esc(u.unidad)}',q:vista.q};render()"><div class="big">${esc(u.unidad)}</div><div class="mut">Piso ${esc(u.piso)} · ${u.fichas.length} fichas</div>${(n=>n?`<span class="tag mtag">📸 ${n} punto${n===1?'':'s'}</span>`:'')(ptsUnidad(p.id,u.unidad).length)}</div>`).join('');
 if(fs.length)h+=`<h3>🧱 Tipos de pared</h3>`+fs.map(f=>`<div class="card list-item" onclick="vista={pantalla:'ficha',id:'${esc(f.id)}',q:vista.q};render()"><div class="big">${esc(f.id)}</div>${tagTipo(f.tipo)}<div>${esc(f.nombre)}</div></div>`).join('');
 return h||'<div class="card mut">No se encontró nada. Prueba con otro número o tipo.</div>';
}
function vUnidad(p,id){const u=p.unidades.find(x=>x.unidad===id);if(!u)return '';
 return `<button class="sec sm" onclick="vista={pantalla:'inicio',q:vista.q};render()">← Volver</button>
 ${p.ejemplo?'<div class="ej">⚠️ EJEMPLO – no usar en obra</div>':''}
 <div class="card"><div class="big">${esc(uLabel(u.unidad))}</div><div class="mut">Piso ${esc(u.piso)}</div>
 ${(pts=>`<p style="margin-bottom:0"><button id="btnMarcasUnidad" data-u="${esc(u.unidad)}" onclick="irMarcasU(this.dataset.u,'unidad')">📸 Marcar / ver reparaciones</button></p>${pts.length?`<div style="margin-top:6px">${chipsConteo(pts)}</div>`:''}`)(ptsUnidad(p.id,u.unidad))}</div>
 <h3>Paredes de esta unidad</h3>`+u.fichas.map(fid=>{const f=p.fichas.find(x=>x.id===fid);return f?`<div class="card list-item" onclick="vista={pantalla:'ficha',id:'${esc(f.id)}',desde:'${esc(u.unidad)}',q:vista.q};render()"><div class="big">${esc(f.id)}</div>${tagTipo(f.tipo)}<div>${esc(f.nombre)}</div>${f.dobleCapa&&/^s[ií]/i.test(f.dobleCapa)?'<div class="alerta">⚠️ Lleva DOBLE CAPA</div>':''}</div>`:''}).join('');
}
function vFicha(p,id){const f=p.fichas.find(x=>x.id===id);if(!f)return '';
 const back=vista.desde?`vista={pantalla:'unidad',id:'${esc(vista.desde)}',q:vista.q}`:`vista={pantalla:'inicio',q:vista.q}`;
 const filas=[['Rating de fuego',f.rating],['Capas de drywall',f.capas],['¿Doble capa? ¿Dónde?',f.dobleCapa],['Tipo de tornillo',f.tornillo],['Patrón de tornillos',f.patron],['Metal / studs',f.metal],['Aislamiento',f.aislamiento],['Número UL / GA',f.ul]];

const SBAN='<div class="ej">⚠️ DEL PROYECTO DEL USUARIO – revisar antes de usar en obra<br><span style="font-weight:600">Texto limpio de las especificaciones (sin PDFs ni nombres). Lo marcado “Pendiente / faltantes” NO está en los documentos: no adivinar.</span></div>';
const SBAN1='<div class="ej">⚠️ DEL PROYECTO DEL USUARIO – revisar antes de usar en obra</div>';
function hayS(){return typeof SPECS!=='undefined'&&Array.isArray(SPECS)&&SPECS.length>0}
function carp(cid){return hayS()?SPECS.find(c=>c.id===cid):null}
/* normaliza sin acentos y guarda el índice original de cada letra */
function nmap(s){let n='',m=[];for(let i=0;i<s.length;i++){const c=s[i].normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();for(const x of c){n+=x;m.push(i)}}return {n,m}}
function nrm(s){return nmap(String(s||'')).n}
function rangos(txt,q){const Q=nrm(q).trim();if(Q.length<2)return [];const {n,m}=nmap(txt),r=[];let i=n.indexOf(Q);while(i>=0){r.push([m[i],m[i+Q.length-1]+1]);i=n.indexOf(Q,i+Q.length)}return r}
function marcar(txt,q){const r=rangos(txt,q);let h='',k=0;r.forEach(([a,b])=>{h+=esc(txt.slice(k,a))+'<mark>'+esc(txt.slice(a,b))+'</mark>';k=b});h+=esc(txt.slice(k));
 return h.replace(/NO ENCONTRADO|AUN NO SE ENCONTRO|NO existe|NO está/g,x=>`<span class="nf">⏳ ${x}</span>`)}
function nombreDoc(d){return d.archivo.replace(/\.txt$/,'').replace(/_/g,' ')}
function vCarpetas(){if(!hayS())return '<div class="card">No hay carpetas en esta versión.</div>';
 return `<button class="sec sm" onclick="vista={pantalla:'inicio'};render()">← Volver</button>${SBAN}
 <h3>📁 Carpetas de especificaciones</h3>
 <label>🔎 Busca en todas las carpetas</label><input id="qs" placeholder="Ej: tornillos, 16&quot; o.c., shaft, nivel 5, primer" autocomplete="off">
 <div id="sres">${specRes(vista.qs||'')}</div>`}
function listaCarpetas(){return SPECS.map(c=>`<div class="card list-item carpeta" data-cid="${esc(c.id)}" onclick="vista={pantalla:'carpeta',cid:'${esc(c.id)}',qs:vista.qs};render()"><div class="big">📁 ${esc(c.nombre)}</div><div class="mut">${c.docs.length} documento${c.docs.length===1?'':'s'}${c.faltantes?' · ⏳ con Pendiente / faltantes':''}</div></div>`).join('')}
function specRes(q){if(nrm(q).trim().length<2)return listaCarpetas();let h='',tot=0;
 SPECS.forEach(c=>{c.docs.forEach((d,i)=>{const r=rangos(d.titulo+'\n'+d.archivo+'\n'+d.texto,q);if(!r.length)return;tot++;
  const t=d.texto,rr=rangos(t,q)[0];const sn=rr?t.slice(Math.max(0,rr[0]-60),rr[1]+80).replace(/\s+/g,' '):d.titulo;
  h+=`<div class="card list-item sres" onclick="vista={pantalla:'doc',cid:'${esc(c.id)}',di:${i},qs:vista.qs,desde:'buscar'};render()"><b>${esc(nombreDoc(d))}</b> <span class="tag">${esc(c.nombre)}</span> <span class="tag">${r.length}×</span><div class="snip">…${marcar(sn,q)}…</div></div>`});
  const rf=c.faltantes?rangos(c.faltantes,q):[];if(rf.length){tot++;h+=`<div class="card list-item sres" onclick="vista={pantalla:'carpeta',cid:'${esc(c.id)}',qs:vista.qs};render()"><b>⏳ Pendiente / faltantes</b> <span class="tag">${esc(c.nombre)}</span> <span class="tag">${rf.length}×</span></div>`}});
 return tot?`<div class="mut">${tot} resultado${tot===1?'':'s'}</div>`+h:'<div class="card mut">No se encontró nada en las carpetas. Prueba con otra palabra.</div>'}
function vCarpeta(cid){const c=carp(cid);if(!c)return vCarpetas();
 return `<button class="sec sm" onclick="vista={pantalla:'carpetas',qs:vista.qs};render()">← Carpetas</button>${SBAN1}

];
function modCard(m,lado){const ico=esc(m.icono),nom=esc(m.nombre),url=esc(m.url);
 if(lado==='oficina')return `<div class="card modcard" id="mod_${esc(m.id)}_oficina" data-mod="${esc(m.id)}"><div class="big">${ico} ${nom}</div><div class="mut">${esc(m.descripcion)}</div>${m.oficina?`<div class="modnota">ℹ️ ${esc(m.oficina)}</div>`:''}<p><a class="btn modlink" style="display:inline-block;text-decoration:none" href="${url}" target="_blank" rel="noopener">${ico} Abrir ${nom} ↗</a></p></div>`;
 return `<a class="card list-item modcard modlink" id="mod_${esc(m.id)}" data-mod="${esc(m.id)}" href="${url}" target="_blank" rel="noopener"><span class="ext">Abrir ↗</span><div class="big">${ico} ${nom}</div><div class="mut">${esc(m.descripcion)}</div></a>`}
function vModulos(lado){if(!MODULOS.length)return '';
 return `<section class="modulos" id="modulos_${lado}"><h3>🧩 Módulos</h3><div class="mut dirnota">Apps anexas a Field to Office. Se abren en una pestaña nueva; para volver, regresa a esta pestaña.</div>${MODULOS.map(m=>modCard(m,lado)).join('')}</section>`}

/* ---------- OFICINA: Recibido del campo (pegar el texto que llegó por WhatsApp / SMS / correo) ---------- */
function claves(){const k={tipo:'Tipo',proyecto:'Proyecto',fecha:'Fecha',foto:'Foto',reporta:'Reporta',id:'ID'},m={};Object.values(k).forEach(v=>m[nrm(v)]=v);
 Object.values(RT).forEach(t=>t.campos.forEach(c=>m[nrm(c.m)]=c.m));return m}
function parseReportes(txt){const K=claves(),bloques=[];let cur=null;
 String(txt||'').replace(/\r/g,'').split('\n').forEach(line=>{
  if(/FIELD TO OFFICE/i.test(line)){cur={pares:[],fin:false};bloques.push(cur);return}
  if(!cur){cur={pares:[],fin:false};bloques.push(cur)}if(cur.fin)return;
  const m=line.match(/^\s*([^:]{2,30}?)\s*:\s?(.*)$/),k=m&&K[nrm(m[1])];
  if(k){cur.pares.push([k,m[2].trim()]);if(k==='ID')cur.fin=true}
  else if(cur.pares.length&&line.trim()){const u=cur.pares[cur.pares.length-1];u[1]+=(u[1]?'\n':'')+line.trim()}
  else if(line.trim())(cur.libre=cur.libre||[]).push(line.trim())});
 return bloques.filter(b=>b.pares.length).map(b=>{const g=k=>{const x=b.pares.find(p=>p[0]===k);return x?x[1]:''};
  const tn=nrm(g('Tipo')),tipo=Object.keys(RT).find(k=>nrm(RT[k].corto)===tn)||'otro';
  return {id:g('ID')||('SIN-ID-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)),tipo,proyecto:g('Proyecto'),fecha:g('Fecha'),nombre:g('Reporta'),foto:/^s[ií]/i.test(g('Foto')),
   pares:b.pares.filter(p=>!['Tipo','Proyecto','Fecha','Foto','Reporta','ID'].includes(p[0])),atendido:false}})}
function importarRec(){const t=$('rec_txt').value;if(!t.trim())return alert('Pega primero el texto del reporte.');
 let nuevos=parseReportes(t);
 if(!nuevos.length){if(!confirm('No parece un reporte de la app (no tiene “Tipo:”, “Unidad:”…). ¿Agregarlo como nota libre?'))return;
  nuevos=[{id:'NOTA-'+Date.now().toString(36).toUpperCase(),tipo:'otro',proyecto:'',fecha:fechaTxt(new Date()),nombre:'',foto:false,pares:[['Texto',t.trim()]],atendido:false}]}
 const R=lsGet(LSREC);let n=0,rep=0;const ahora=Date.now();
 nuevos.forEach(x=>{if(R.some(y=>y.id===x.id)){rep++;return}x.recibido=ahora;R.unshift(x);n++});
 if(!lsSet(LSREC,R))return alert('No hay espacio para guardar.');
 vista={pantalla:'inicio',lado:'rec'};render();toast(n?`${n} agregado${n===1?'':'s'}${rep?` · ${rep} ya estaba${rep===1?'':'n'}`:''}`:'Ya estaba en la lista')}
function vRecibido(){const R=lsGet(LSREC).slice().sort((a,b)=>(a.atendido-b.atendido)||((b.recibido||0)-(a.recibido||0)));
 return `<div class="mut dirnota" id="notaRec">Lo que mandan los supers y foremen desde “⬆️ Para la oficina”.</div>
 <div class="card" id="recInfo"><h3>📥 Cómo llega lo del campo</h3><p class="mut">Todavía no hay servidor ni chat. El campo llena el formulario en su teléfono y lo manda por WhatsApp, SMS o correo; la foto llega en ese mismo mensaje. Para llevar la lista aquí: copia el texto del mensaje y pégalo abajo. La lista se guarda solo en este aparato.</p>
 <label for="rec_txt">Pega aquí el texto recibido (puedes pegar varios juntos)</label><textarea id="rec_txt" style="min-height:110px" placeholder="📋 FIELD TO OFFICE – PARA LA OFICINA&#10;Tipo: …&#10;Unidad: …"></textarea>
 <p><button id="btnImportar" onclick="importarRec()">➕ Agregar a la lista</button></p></div>
 <h3>📋 Recibidos (${R.length}${R.length?' · '+R.filter(r=>!r.atendido).length+' pendientes':''})</h3>
 ${R.length?R.map(r=>{const d=rt(r.tipo);return `<div class="card recitem${r.atendido?' atendido':''}" data-id="${esc(r.id)}"><b>${d.ico} ${esc(d.corto)}</b> ${r.atendido?'<span class="tag okt">Atendido ✓</span>':'<span class="tag pen">Pendiente</span>'}${r.foto?' <span class="tag">📷 foto en el mensaje</span>':''}${r.pares.some(p=>p[0]==='Parches / puntos')?' <span class="tag mtag">📸 marcas con cámara</span>':''}
  <div class="mut">${[r.proyecto,r.fecha,r.nombre&&('Reporta: '+r.nombre),r.id].filter(Boolean).map(esc).join(' · ')}</div>
  <div class="spec">${r.pares.map(p=>`<div>${esc(p[0])}</div><div style="white-space:pre-wrap">${esc(p[1])}</div>`).join('')}</div>
  <div class="row" style="margin-top:10px"><button class="sec sm" onclick="toggleRec('${esc(r.id)}')">${r.atendido?'↩️ Volver a pendiente':'✓ Marcar atendido'}</button><button class="red sm" style="flex:0" onclick="borrarRec('${esc(r.id)}')">🗑️</button></div></div>`}).join(''):'<div class="card mut" id="recVacio">Todavía no hay nada recibido en esta lista.</div>'}`}
function toggleRec(id){const R=lsGet(LSREC),r=R.find(x=>x.id===id);if(r){r.atendido=!r.atendido;lsSet(LSREC,R)}render()}
function borrarRec(id){if(!confirm('¿Borrar de la lista?'))return;lsSet(LSREC,lsGet(LSREC).filter(x=>x.id!==id));render()}
/* ---------- OFICINA ---------- */
function vOficina(p){
 if(!admin){const tiene=!!localStorage.getItem(LSPIN);
  return `<div class="card"><h3>🏢 Oficina</h3><p class="mut">${tiene?'Escribe tu PIN de oficina.':'Primera vez: crea tu PIN de oficina (mínimo 4 números). Solo queda guardado en este teléfono.'}</p>
  <input id="pin" type="password" inputmode="numeric" placeholder="PIN">${tiene?'':'<input id="pin2" type="password" inputmode="numeric" placeholder="Repite el PIN" style="margin-top:8px">'}
  <p><button onclick="entrar(${tiene})">Entrar</button></p></div>`;}
 if(vista.pantalla==='editFicha')return vEditFicha(p,vista.id);
 if(vista.pantalla==='editUnidad')return vEditUnidad(p,vista.id);
 const lado=vista.lado==='rec'?'rec':'subir', nPend=lsGet(LSREC).filter(r=>!r.atendido).length;
 return `${p.ejemplo?'<div class="ej">⚠️ EJEMPLO – no usar en obra · crea un proyecto nuevo con tus datos</div>':''}
 <div class="tabs dir"><button id="tabSubir" class="${lado==='subir'?'on':'off'}" onclick="vista={pantalla:'inicio',lado:'subir'};render()">⬆️ Subir al campo</button><button id="tabRec" class="${lado==='rec'?'on':'off'}" onclick="vista={pantalla:'inicio',lado:'rec'};render()">⬇️ Recibido del campo${nPend?' ('+nPend+')':''}</button></div>
 ${lado==='rec'?vRecibido():vSubir(p)}
 ${vModulos('oficina')}`;
}
/* Oficina → Campo: edición de lo que ven supers y foremen */
function vSubir(p){
 return `<div class="mut dirnota" id="notaSubir">Lo que preparas aquí lo ven los supers y foremen en “⬇️ De la oficina”.</div>
 <div class="card"><h3>📁 Proyecto</h3>
 <select onchange="localStorage.setItem(LSPROJ,this.value);render()">${data.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select>
 <label>Nombre</label><input value="${esc(p.nombre)}" onchange="proj().nombre=this.value;save();render()">
 <div class="row" style="margin-top:10px"><button class="sec sm" onclick="nuevoProyecto()">+ Proyecto nuevo</button><button class="red sm" onclick="borrarProyecto()">Borrar proyecto</button></div></div>
 <div class="card"><h3>🔗 Compartir con supers y foremen</h3><p class="mut">Crea un enlace con las fichas y unidades de este proyecto. Al abrirlo, el proyecto se guarda en su teléfono. (En este prototipo, las fotos y PDFs no viajan en el enlace.)</p>
 <button onclick="compartir()">📨 Crear enlace</button><div id="enl"></div></div>
 ${hayS()?`<div class="card"><h3>📁 Carpetas de especificaciones</h3><p class="mut">Texto limpio de las specs del proyecto (sin PDFs). Vienen con la app; se actualizan con cada versión. Las fichas y unidades se siguen editando abajo.</p>${SPECS.map(c=>`<span class="tag">${esc(c.nombre)} · ${c.docs.length}</span>`).join('')}<p><button class="sec sm" onclick="modo='campo';vista={pantalla:'carpetas'};render()">👁️ Ver como campo</button></p></div>`:''}
 <h3>🧱 Fichas por tipo de pared</h3>
 ${p.fichas.map(f=>`<div class="card list-item" onclick="vista={pantalla:'editFicha',id:'${esc(f.id)}'};render()"><b>${esc(f.id)}</b> ${tagTipo(f.tipo)}<div class="mut">${esc(f.nombre)} · ${(f.adj||[]).length} archivos</div></div>`).join('')}
 <button class="sec" onclick="vista={pantalla:'editFicha',id:null};render()">+ Nueva ficha</button>
 <h3>🏠 Unidades</h3>
 ${p.unidades.map(u=>`<div class="card list-item" onclick="vista={pantalla:'editUnidad',id:'${esc(u.unidad)}'};render()"><b>${esc(u.unidad)}</b> <span class="mut">Piso ${esc(u.piso)}</span><div>${u.fichas.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div>`).join('')}
 <button class="sec" onclick="vista={pantalla:'editUnidad',id:null};render()">+ Nueva unidad</button>
 <div class="card"><p class="mut">Respaldo</p><div class="row"><button class="sec sm" onclick="exportar()">⬇️ Exportar</button><label class="btn sec sm" style="margin:0;text-align:center;background:#333;color:#fff">⬆️ Importar<input type="file" accept=".json" class="hidden" onchange="importar(this)"></label></div>
 <p><button class="sec sm" onclick="admin=false;render()">🔒 Salir de oficina</button></p></div>`;
}
async function entrar(tiene){const v=$('pin').value.trim();if(!/^\d{4,}$/.test(v))return alert('El PIN debe tener al menos 4 números.');
 if(tiene){if(await sha(v)!==localStorage.getItem(LSPIN))return alert('PIN incorrecto.');}
 else{if(v!==$('pin2').value.trim())return alert('Los PIN no coinciden.');localStorage.setItem(LSPIN,await sha(v));toast('PIN creado')}
 admin=true;vista={pantalla:'inicio'};render()}
const CAMPOS=[['id','Código (ej: A, 1H, SH2)'],['nombre','Nombre / descripción corta'],['rating','Rating de fuego (horas)'],['capas','Capas de drywall'],['dobleCapa','¿Doble capa? ¿Dónde?'],['tornillo','Tipo de tornillo'],['patron','Patrón de tornillos'],['metal','Metal / studs'],['aislamiento','Aislamiento'],['ul','Número UL / GA'],['alerta','Alerta importante (sale en rojo)'],['notas','Notas cortas']];
function vEditFicha(p,id){const f=p.fichas.find(x=>x.id===id)||{tipo:'pared',adj:[]};
 return `<button class="sec sm" onclick="vista={pantalla:'inicio'};render()">← Volver</button>
 ${p.ejemplo?'<div class="ej">⚠️ EJEMPLO – no usar en obra</div>':''}<div class="card"><h3>${id?'Editar ficha '+esc(id):'Nueva ficha'}</h3>
 <label>Tipo</label><select id="f_tipo">${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}" ${f.tipo===k?'selected':''}>${v}</option>`).join('')}</select>
 ${CAMPOS.map(([k,l])=>`<label>${l}</label>${k==='notas'?`<textarea id="f_${k}" data-mic>${esc(f[k])}</textarea>`:`<input id="f_${k}" value="${esc(f[k])}">`}`).join('')}
 <label>Fotos y PDFs</label><div id="adjs">${(f.adj||[]).map((x,i)=>`<div class="row"><span>${x.tipo==='pdf'?'📄':'🖼️'} ${esc(x.nombre)}</span><button class="red sm" style="flex:0" onclick="quitarAdj(${i})">✕</button></div>`).join('')||'<span class="mut">Sin archivos</span>'}</div>
 <input type="file" accept="image/*,application/pdf" multiple onchange="agregarAdj(this)" style="margin-top:8px">
 <div class="row" style="margin-top:14px"><button onclick="guardarFicha('${esc(id||'')}')">💾 Guardar</button>${id?`<button class="red" onclick="borrarFicha('${esc(id)}')">Borrar</button>`:''}</div></div>`;}
let adjTemp=null;
function fichaActual(){const p=proj();return p.fichas.find(x=>x.id===vista.id)}
function leerForm(){const o={tipo:$('f_tipo').value};CAMPOS.forEach(([k])=>o[k]=$('f_'+k).value.trim());return o}
function guardarFicha(id){const p=proj(),o=leerForm();if(!o.id)return alert('Pon un código.');
 if(o.id!==id&&p.fichas.some(x=>x.id===o.id))return alert('Ese código ya existe.');
 const f=p.fichas.find(x=>x.id===id);if(f){Object.assign(f,o);if(id!==o.id)p.unidades.forEach(u=>u.fichas=u.fichas.map(x=>x===id?o.id:x))}else p.fichas.push({...o,adj:adjTemp||[]});
 adjTemp=null;save();toast('Ficha guardada');vista={pantalla:'inicio'};render()}
function borrarFicha(id){if(!confirm('¿Borrar la ficha '+id+'?'))return;const p=proj();p.fichas=p.fichas.filter(x=>x.id!==id);p.unidades.forEach(u=>u.fichas=u.fichas.filter(x=>x!==id));save();vista={pantalla:'inicio'};render()}
function achicar(file){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{if(file.type==='application/pdf')return r({tipo:'pdf',nombre:file.name,data:fr.result});
 const im=new Image();im.onload=()=>{const m=1400,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r({tipo:'img',nombre:file.name,data:c.toDataURL('image/jpeg',.75)})};im.src=fr.result};fr.readAsDataURL(file)})}
async function agregarAdj(inp){const f=fichaActual();const arr=f?f.adj=(f.adj||[]):(adjTemp=adjTemp||[]);for(const file of inp.files)arr.push(await achicar(file));if(f)save();
 const keep=f?null:leerForm();render();if(keep)CAMPOS.forEach(([k])=>$('f_'+k).value=keep[k]);toast('Archivo agregado')}
function quitarAdj(i){const f=fichaActual();if(f){f.adj.splice(i,1);save()}else adjTemp&&adjTemp.splice(i,1);render()}
function vEditUnidad(p,id){const u=p.unidades.find(x=>x.unidad===id)||{unidad:'',piso:'',fichas:[]};
 return `<button class="sec sm" onclick="vista={pantalla:'inicio'};render()">← Volver</button>
 <div class="card"><h3>${id?'Editar unidad':'Nueva unidad'}</h3>
 <label>Unidad (número o nombre)</label><input id="u_n" value="${esc(u.unidad)}"><label>Piso</label><input id="u_p" value="${esc(u.piso)}" inputmode="numeric">
 <label>Paredes / fichas que lleva</label>${p.fichas.map(f=>`<label style="color:var(--tx)"><input type="checkbox" style="width:auto" class="u_f" value="${esc(f.id)}" ${u.fichas.includes(f.id)?'checked':''}> ${esc(f.id)} – ${esc(f.nombre)}</label>`).join('')}
 <div class="row" style="margin-top:14px"><button onclick="guardarUnidad('${esc(id||'')}')">💾 Guardar</button>${id?`<button class="red" onclick="borrarUnidad('${esc(id)}')">Borrar</button>`:''}</div></div>`;}
function guardarUnidad(id){const p=proj(),n=$('u_n').value.trim();if(!n)return alert('Pon el número de unidad.');
 if(n!==id&&p.unidades.some(x=>x.unidad===n))return alert('Esa unidad ya existe.');
 const o={unidad:n,piso:$('u_p').value.trim(),fichas:[...document.querySelectorAll('.u_f:checked')].map(x=>x.value)};
 const u=p.unidades.find(x=>x.unidad===id);if(u)Object.assign(u,o);else p.unidades.push(o);save();toast('Unidad guardada');vista={pantalla:'inicio'};render()}
function borrarUnidad(id){if(!confirm('¿Borrar la unidad '+id+'?'))return;const p=proj();p.unidades=p.unidades.filter(x=>x.unidad!==id);save();vista={pantalla:'inicio'};render()}
function nuevoProyecto(){const n=prompt('Nombre del proyecto nuevo:');if(!n)return;const id='p'+Date.now().toString(36);data.push({id,nombre:n,fichas:[],unidades:[]});localStorage.setItem(LSPROJ,id);save();render()}
function borrarProyecto(){const p=proj();if(!confirm('¿Borrar el proyecto "'+p.nombre+'" de este teléfono?'))return;data=data.filter(x=>x!==p);if(!data.length)data=[ejemplo()];localStorage.removeItem(LSPROJ);save();render()}
/* enlace: proyecto sin archivos, comprimido en el #hash */
async function comprimir(s){const cs=new Blob([s]).stream().pipeThrough(new CompressionStream('deflate-raw'));const b=new Uint8Array(await new Response(cs).arrayBuffer());let t='';b.forEach(x=>t+=String.fromCharCode(x));return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function descomprimir(s){const t=atob(s.replace(/-/g,'+').replace(/_/g,'/'));const b=Uint8Array.from(t,c=>c.charCodeAt(0));const ds=new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return await new Response(ds).text()}
async function compartir(){const p=proj();const c=JSON.parse(JSON.stringify(p));c.fichas.forEach(f=>f.adj=[]);
 const url=location.origin+location.pathname+'#p='+await comprimir(JSON.stringify(c));
 const msg='Guía de campo – '+p.nombre+': '+url;
 $('enl').innerHTML=`<textarea readonly style="margin-top:8px">${esc(url)}</textarea><div class="row" style="margin-top:8px"><button class="sm" onclick="navigator.clipboard.writeText(${esc(JSON.stringify(url))}).then(()=>toast('Copiado'))">📋 Copiar</button><a class="btn sm" style="text-align:center;text-decoration:none" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank">WhatsApp</a><a class="btn sm" style="text-align:center;text-decoration:none" href="sms:?&body=${encodeURIComponent(msg)}">SMS</a></div>`;}
async function leerEnlace(){const m=location.hash.match(/^#p=(.+)$/);if(!m)return;
 try{let p=JSON.parse(await descomprimir(m[1]));if(!p||!p.id||!Array.isArray(p.fichas))throw 0;
  if(p.id==='ejemplo'&&(p.ver||1)<EJ_VER)p=ejemplo();
  const i=data.findIndex(x=>x.id===p.id);if(i>=0){p.fichas.forEach(f=>{const old=data[i].fichas.find(o=>o.id===f.id);if(old)f.adj=old.adj||[]});data[i]=p}else data.push(p);
  localStorage.setItem(LSPROJ,p.id);save();toast('Proyecto recibido: '+p.nombre)}catch(e){alert('El enlace no es válido o está incompleto.')}
 history.replaceState(null,'',location.pathname)}
function exportar(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='field-to-office-respaldo.json';a.click()}
function importar(inp){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!Array.isArray(d))throw 0;data=d;save();toast('Importado');render()}catch(e){alert('Archivo no válido')}};fr.readAsText(inp.files[0])}
$('btnModo').onclick=()=>{modo=modo==='oficina'?'campo':'oficina';vista={pantalla:'inicio'};render()};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
leerEnlace().then(render);
</script>
